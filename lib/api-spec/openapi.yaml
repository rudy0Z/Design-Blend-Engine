openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Design Blend API — taste profiling + matching for designers
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: styles
  - name: quiz
  - name: profiles
  - name: blends
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /styles:
    get:
      operationId: listStyles
      tags: [styles]
      summary: List style nodes (filterable)
      parameters:
        - in: query
          name: field
          required: false
          schema: { type: string }
        - in: query
          name: domain
          required: false
          schema: { type: string }
        - in: query
          name: depth
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Style list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StyleNode" }

  /styles/{id}:
    get:
      operationId: getStyle
      tags: [styles]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Style node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StyleNode" }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /quiz/sessions:
    post:
      operationId: createQuizSession
      tags: [quiz]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartSessionBody" }
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizSession" }

  /quiz/sessions/{id}:
    get:
      operationId: getQuizSession
      tags: [quiz]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizSession" }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /quiz/sessions/{id}/next:
    get:
      operationId: getNextStyle
      tags: [quiz]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Next style or completion signal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NextStyleResponse" }
        "404":
          description: Session not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /quiz/sessions/{id}/ratings:
    post:
      operationId: submitRating
      tags: [quiz]
      summary: Submit a rating for a style
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RatingBody" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizSession" }
        "404":
          description: Session not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /quiz/sessions/{id}/complete:
    post:
      operationId: completeQuizSession
      tags: [quiz]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Profile generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404":
          description: Session not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /profiles/{username}:
    get:
      operationId: getProfileByUsername
      tags: [profiles]
      parameters:
        - in: path
          name: username
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /profiles:
    post:
      operationId: saveProfile
      tags: [profiles]
      summary: Save a profile from a completed quiz session, optionally claiming a username
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveProfileBody" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Username taken
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get the signed-in user's profile, if any
      responses:
        "200":
          description: Profile or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Profile"
                  - type: "null"
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /profiles/{username}/privacy:
    patch:
      operationId: updateProfilePrivacy
      tags: [profiles]
      parameters:
        - in: path
          name: username
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePrivacyBody" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Forbidden
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /blends/invite:
    post:
      operationId: createBlendInvite
      tags: [blends]
      summary: Create a short-lived invite token for the signed-in user's profile
      responses:
        "200":
          description: Invite created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlendInvite" }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Profile not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /blends/invite/{token}:
    get:
      operationId: getBlendInvite
      tags: [blends]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlendInvite" }
        "404":
          description: Not found or expired
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /blends/{userA}/{userB}:
    get:
      operationId: getBlendByUsers
      tags: [blends]
      summary: Get (or create) a blend between two profiles by username
      parameters:
        - in: path
          name: userA
          required: true
          schema: { type: string }
        - in: path
          name: userB
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Blend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blend" }
        "404":
          description: One or both profiles not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    AxisScores:
      type: object
      properties:
        order_chaos: { type: number }
        minimal_maximal: { type: number }
        classic_contemporary: { type: number }
        functional_expressive: { type: number }
        warm_cold: { type: number }
        flat_dimensional: { type: number }
        literal_abstract: { type: number }
        system_intuition: { type: number }
      required:
        - order_chaos
        - minimal_maximal
        - classic_contemporary
        - functional_expressive
        - warm_cold
        - flat_dimensional
        - literal_abstract
        - system_intuition

    StyleNode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        field: { type: string }
        domain: { type: string }
        depth: { type: integer }
        visualCharacter: { type: string }
        referencePoint: { type: string }
        imageUrl: { type: string }
        axisLoadings: { $ref: "#/components/schemas/AxisScores" }
        parent:
          type: ["string", "null"]
        children:
          type: array
          items: { type: string }
        neighbors:
          type: array
          items: { type: string }
        contrasts:
          type: array
          items: { type: string }
        popularity: { type: number }
      required:
        - id
        - label
        - field
        - domain
        - depth
        - visualCharacter
        - referencePoint
        - imageUrl
        - axisLoadings
        - children
        - neighbors
        - contrasts
        - popularity

    Rating:
      type: object
      properties:
        nodeId: { type: string }
        rating: { type: number }
        ratedAt: { type: string }
        responseTimeMs: { type: number }
      required: [nodeId, rating, ratedAt]

    QuizSession:
      type: object
      properties:
        id: { type: string }
        profileId:
          type: ["string", "null"]
        userId:
          type: ["string", "null"]
        selectedFields:
          type: array
          items: { type: string }
        selectedCategories:
          type: array
          items: { type: string }
        ratings:
          type: array
          items: { $ref: "#/components/schemas/Rating" }
        visitedNodes:
          type: array
          items: { type: string }
        status: { type: string }
        totalTarget: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - selectedFields
        - selectedCategories
        - ratings
        - visitedNodes
        - status
        - totalTarget
        - createdAt
        - updatedAt

    StartSessionBody:
      type: object
      properties:
        selectedFields:
          type: array
          items: { type: string }
        selectedCategories:
          type: array
          items: { type: string }
        userId:
          type: ["string", "null"]
        targetCount:
          type: ["integer", "null"]
      required: [selectedFields]

    RatingBody:
      type: object
      properties:
        nodeId: { type: string }
        rating:
          type: number
          minimum: 0
          maximum: 100
        responseTimeMs:
          type: number
          minimum: 0
          description: Time in ms between showing the style and the user submitting a rating. Used for gut-reaction weighting.
      required: [nodeId, rating]

    NextStyleResponse:
      type: object
      properties:
        done: { type: boolean }
        progress: { type: number }
        target: { type: integer }
        ratedCount: { type: integer }
        node:
          oneOf:
            - $ref: "#/components/schemas/StyleNode"
            - type: "null"
      required: [done, progress, target, ratedCount]

    Profile:
      type: object
      properties:
        id: { type: string }
        userId:
          type: ["string", "null"]
        username: { type: string }
        displayName:
          type: ["string", "null"]
        archetypeId: { type: string }
        archetypeTitle: { type: string }
        archetypeDescription: { type: string }
        archetypeColor: { type: string }
        axes: { $ref: "#/components/schemas/AxisScores" }
        styleVector:
          type: object
          additionalProperties: { type: number }
        topStyles:
          type: array
          items: { type: string }
        fieldDistribution:
          type: object
          additionalProperties: { type: number }
        fieldScores:
          type: object
          additionalProperties: { type: number }
        categoryScores:
          type: object
          additionalProperties: { type: number }
        selectedFields:
          type: array
          items: { type: string }
        confidence: { type: number }
        isPublic: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - username
        - archetypeId
        - archetypeTitle
        - archetypeDescription
        - archetypeColor
        - axes
        - styleVector
        - topStyles
        - fieldDistribution
        - fieldScores
        - categoryScores
        - selectedFields
        - confidence
        - isPublic
        - createdAt
        - updatedAt

    SaveProfileBody:
      type: object
      properties:
        sessionId: { type: string }
        username: { type: string }
        displayName:
          type: ["string", "null"]
      required: [sessionId, username]

    UpdatePrivacyBody:
      type: object
      properties:
        isPublic: { type: boolean }
      required: [isPublic]

    BlendInvite:
      type: object
      properties:
        id: { type: string }
        token: { type: string }
        profileId: { type: string }
        username: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
      required: [id, token, profileId, username, createdAt, expiresAt]

    SharedStyle:
      type: object
      properties:
        nodeId: { type: string }
        label: { type: string }
        scoreA: { type: number }
        scoreB: { type: number }
      required: [nodeId, label, scoreA, scoreB]

    Blend:
      type: object
      properties:
        id: { type: string }
        profileAId: { type: string }
        profileBId: { type: string }
        usernameA: { type: string }
        usernameB: { type: string }
        similarity: { type: number }
        axisDeltas:
          type: object
          additionalProperties: { type: number }
        sharedStyles:
          type: array
          items: { $ref: "#/components/schemas/SharedStyle" }
        divergentStyles:
          type: array
          items: { $ref: "#/components/schemas/SharedStyle" }
        collaborationLine: { type: string }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - profileAId
        - profileBId
        - usernameA
        - usernameB
        - similarity
        - axisDeltas
        - sharedStyles
        - divergentStyles
        - collaborationLine
        - createdAt
