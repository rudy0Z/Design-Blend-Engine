openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Design Blend API — taste profiling + matching for designers
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: styles
  - name: quiz
  - name: profiles
  - name: blends
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /styles:
    get:
      operationId: listStyles
      tags: [styles]
      summary: List all style nodes
      parameters:
        - in: query
          name: field
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Style list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StyleNode"

  /styles/{id}:
    get:
      operationId: getStyle
      tags: [styles]
      summary: Get one style node
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Style node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleNode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quiz/sessions:
    post:
      operationId: createQuizSession
      tags: [quiz]
      summary: Start a new quiz session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionBody"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"

  /quiz/sessions/{id}:
    get:
      operationId: getQuizSession
      tags: [quiz]
      summary: Get session state
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quiz/sessions/{id}/next:
    get:
      operationId: getNextStyle
      tags: [quiz]
      summary: Get the next style to rate (adaptive)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Next style or completion signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextStyleResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quiz/sessions/{id}/rate:
    post:
      operationId: rateStyle
      tags: [quiz]
      summary: Submit a rating for a style
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateStyleBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quiz/sessions/{id}/complete:
    post:
      operationId: completeQuizSession
      tags: [quiz]
      summary: Finalize quiz, compute axes, create profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a public profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /blends:
    post:
      operationId: createBlend
      tags: [blends]
      summary: Create a blend between two profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlendBody"
      responses:
        "201":
          description: Blend created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blend"
        "404":
          description: One or both profiles not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /blends/{id}:
    get:
      operationId: getBlend
      tags: [blends]
      summary: Get a blend
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blend"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    AxisScores:
      type: object
      properties:
        order_chaos: { type: number }
        minimal_maximal: { type: number }
        classic_contemporary: { type: number }
        functional_expressive: { type: number }
        warm_cold: { type: number }
        flat_dimensional: { type: number }
        literal_abstract: { type: number }
        system_intuition: { type: number }
      required:
        - order_chaos
        - minimal_maximal
        - classic_contemporary
        - functional_expressive
        - warm_cold
        - flat_dimensional
        - literal_abstract
        - system_intuition

    StyleNode:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        field: { type: string }
        category: { type: string }
        visualCharacter: { type: string }
        referencePoint: { type: string }
        imageUrl: { type: string }
        axisLoadings: { $ref: "#/components/schemas/AxisScores" }
        parents:
          type: array
          items: { type: string }
        children:
          type: array
          items: { type: string }
        neighbors:
          type: array
          items: { type: string }
        contrasts:
          type: array
          items: { type: string }
        popularity: { type: number }
      required:
        - id
        - name
        - field
        - category
        - visualCharacter
        - referencePoint
        - imageUrl
        - axisLoadings
        - parents
        - children
        - neighbors
        - contrasts
        - popularity

    Rating:
      type: object
      properties:
        nodeId: { type: string }
        rating: { type: number }
        ratedAt: { type: string }
      required: [nodeId, rating, ratedAt]

    QuizSession:
      type: object
      properties:
        id: { type: string }
        profileId:
          type: ["string", "null"]
        userId:
          type: ["string", "null"]
        selectedFields:
          type: array
          items: { type: string }
        selectedCategories:
          type: array
          items: { type: string }
        ratings:
          type: array
          items: { $ref: "#/components/schemas/Rating" }
        visitedNodes:
          type: array
          items: { type: string }
        status: { type: string }
        totalTarget: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - selectedFields
        - selectedCategories
        - ratings
        - visitedNodes
        - status
        - totalTarget
        - createdAt
        - updatedAt

    StartSessionBody:
      type: object
      properties:
        selectedFields:
          type: array
          items: { type: string }
        selectedCategories:
          type: array
          items: { type: string }
        userId:
          type: ["string", "null"]
        targetCount:
          type: ["integer", "null"]
      required: [selectedFields]

    RateStyleBody:
      type: object
      properties:
        nodeId: { type: string }
        rating:
          type: number
          description: 0–100 score (use 40 for skip)
      required: [nodeId, rating]

    NextStyleResponse:
      type: object
      properties:
        done: { type: boolean }
        progress: { type: number }
        target: { type: integer }
        ratedCount: { type: integer }
        node:
          oneOf:
            - $ref: "#/components/schemas/StyleNode"
            - type: "null"
      required: [done, progress, target, ratedCount]

    Profile:
      type: object
      properties:
        id: { type: string }
        userId:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
        archetypeId: { type: string }
        archetypeTitle: { type: string }
        archetypeDescription: { type: string }
        archetypeColor: { type: string }
        axes: { $ref: "#/components/schemas/AxisScores" }
        styleVector:
          type: object
          additionalProperties: { type: number }
        topStyles:
          type: array
          items: { type: string }
        confidence: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - archetypeId
        - archetypeTitle
        - archetypeDescription
        - archetypeColor
        - axes
        - styleVector
        - topStyles
        - confidence
        - createdAt
        - updatedAt

    CreateBlendBody:
      type: object
      properties:
        profileAId: { type: string }
        profileBId: { type: string }
      required: [profileAId, profileBId]

    SharedStyle:
      type: object
      properties:
        nodeId: { type: string }
        name: { type: string }
        scoreA: { type: number }
        scoreB: { type: number }
      required: [nodeId, name, scoreA, scoreB]

    Blend:
      type: object
      properties:
        id: { type: string }
        profileAId: { type: string }
        profileBId: { type: string }
        similarity: { type: number }
        axisDeltas:
          type: object
          additionalProperties: { type: number }
        sharedStyles:
          type: array
          items: { $ref: "#/components/schemas/SharedStyle" }
        divergentStyles:
          type: array
          items: { $ref: "#/components/schemas/SharedStyle" }
        collaborationLine: { type: string }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - profileAId
        - profileBId
        - similarity
        - axisDeltas
        - sharedStyles
        - divergentStyles
        - collaborationLine
        - createdAt
